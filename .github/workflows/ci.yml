name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint and code quality
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- Bash: shellcheck ---------------------------------------------------
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on Bash scripts
        run: |
          if find src/ -name "*.sh" -print0 | xargs -0 -r shellcheck; then
            echo "shellcheck passed."
          else
            bash_count=$(find src/ -name "*.sh" | wc -l)
            if [ "$bash_count" -eq 0 ]; then
              echo "No Bash files found in src/ — skipping shellcheck."
            else
              exit 1
            fi
          fi

      # --- Python: black + pylint ---------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pylint black
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check formatting with black
        run: |
          python_files=$(find src/ -name "*.py" 2>/dev/null || true)
          if [ -n "$python_files" ]; then
            black --check src/
          else
            echo "No Python files found in src/ — skipping black."
          fi

      - name: Lint with pylint (minimum score 7.0)
        run: |
          python_files=$(find src/ -name "*.py" 2>/dev/null || true)
          if [ -n "$python_files" ]; then
            pylint src/ --fail-under=7.0
          else
            echo "No Python files found in src/ — skipping pylint."
          fi

  # ---------------------------------------------------------------------------
  # Job 2: Tests with coverage gate
  # ---------------------------------------------------------------------------
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint   # Only run tests if lint passes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pytest with coverage
        # Minimum required coverage is 70%. Tests are stored in tests/ and must maintain at least 70% coverage.
        run: |
          if find tests/ \( -name "test_*.py" -o -name "*_test.py" \) -print -quit 2>/dev/null | grep -q .; then
            pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=70 -v
          else
            echo "Error: no pytest test files found in tests/."
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job: Scheduled metrics collection (runs the pipeline, commits results)
  # ---------------------------------------------------------------------------
  collect:
    name: Scheduled Metrics Collection
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bash collector
        run: bash src/orchestrator.sh

      - name: Run Python aggregator
        run: python3 src/processor.py --input raw_metrics.txt --output health.json

      - name: Commit and push updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add health.json
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "chore(data): update health.json and raw_metrics.txt [skip ci]"
          git push

    # ---------------------------------------------------------------------------
  # Job 3: Docker build and end-to-end integration validation
  # ---------------------------------------------------------------------------
  build:
    name: Build & Integration
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Generate real monitoring data before starting the dashboard.
      # This validates the same Bash -> Python -> Docker workflow used locally.
      - name: Generate infrastructure health report
        run: |
          bash src/orchestrator.sh
          python3 src/processor.py \
            --input raw_metrics.txt \
            --output health.json

      # Build and launch the dashboard using the submitted Docker Compose file.
      - name: Build and start dashboard
        run: docker compose up --build -d

      # Wait for the Dockerfile HEALTHCHECK to report a healthy container.
      - name: Wait for dashboard health check
        run: |
          for attempt in {1..12}; do
            status=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              infrastructure-health-dashboard)

            echo "Health check attempt ${attempt}: ${status}"

            if [ "$status" = "healthy" ]; then
              exit 0
            fi

            sleep 5
          done

          echo "Dashboard did not become healthy within 60 seconds."
          docker compose logs
          exit 1

      # Exercise both public routes through the running Docker container.
      - name: Test dashboard endpoints
        run: |
          curl --fail --show-error http://127.0.0.1:8000/ > /tmp/dashboard.html
          curl --fail --show-error http://127.0.0.1:8000/health.json > /tmp/health.json

          grep -q "Infrastructure Health Dashboard" /tmp/dashboard.html
          grep -q '"metrics"' /tmp/health.json

      # Always display the container state to make CI failures easier to diagnose.
      - name: Show Docker status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=100

      # Always remove containers and the custom network after the CI run.
      - name: Shut down dashboard
        if: always()
        run: docker compose down
