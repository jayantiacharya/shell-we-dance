# config.yaml - Configuration for the Infra Health Dashboard pipeline
# CS 3030 - Project 7: Final Capstone

# Runtime values used by the completed monitoring pipeline.
# This is read by orchestrator.sh's load_config() function.

# Path where the Bash collector writes its raw output
raw_metrics_path: "raw_metrics.txt"

# Path where the Python aggregator writes its structured report
health_report_path: "health.json"

# Path to the log directory the collector should measure
log_directory: /var/log

# Thresholds are currently implemented in processor.py.
# Example configuration for a future enhancement:
# thresholds:
#   disk_usage_percent: 85
#   cpu_load_1min: 4.0
