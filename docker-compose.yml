# docker-compose.yml - Runs the dashboard container
# CS 3030 - Project 7: Final Capstone
# Owner: Omar
#
# Purpose:
#   Build and run the Infrastructure Health Dashboard with one command.
#   The service exposes the dashboard on localhost:8000 and mounts the
#   latest health.json report generated by the Bash/Python pipeline.
#
# The health.json file is mounted read-only because the dashboard only
# displays monitoring data and should never modify the generated report.


services:
  dashboard:
    # Build the image using the Dockerfile in the project root.
    build: .

    # Give the running container a descriptive name.
    container_name: infrastructure-health-dashboard

    # Map local port 8000 to the dashboard's container port.
    # Users can open the dashboard at:
    # http://localhost:8000
    ports:
      - "8000:8000"

    # Mount the generated health report into the location expected
    # by dashboard_server.py.
    #
    # The :ro option makes the file read-only inside the container.
    volumes:
      - ./health.json:/data/health.json:ro
      - dashboard-cache:/tmp/dashboard

    # Place the dashboard on a dedicated Docker network.
    networks:
      - health-network

    # Restart automatically if the process exits unexpectedly.
    restart: unless-stopped

# Named volume required for persistent container-managed data.
volumes:
  dashboard-cache:

# Custom network keeps the application's Docker networking explicit
# and leaves room for additional project services in the future.
networks:
  health-network:
    driver: bridge
